# Jekyll configuration
# Github limits configuration options. See https://help.github.com/en/github/working-with-github-pages/about-github-pages-and-jekyll#configuring-jekyll-in-your-github-pages-site
markdown: kramdown
highlighter: rouge
paginate: 5
language: 'en-us'

kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Set the host to 0.0.0.0 for use on containers.
host: 0.0.0.0

# Website info
name: 'John Yeary'
description: "A Caffeinated Java Developer."

url: https://johnyeary.com
short_url: 'johnyeary.com/'
# GA4 Measurement ID (looks like G-XXXXXXXXXX), from the property's Data Streams.
# The old Universal Analytics property (UA-4194623-5) stopped collecting in 2023.
# The gtag.js snippet renders only when this is set and JEKYLL_ENV=production.
google_analytics: G-R7XB4Q5E5K
disqus: john-yeary
baseurl: /

# Permalinks
permalink: :year-:month-:day-:title:output_ext

# gems and other configs
plugins:
  - jekyll-paginate
  - jekyll-sitemap

# Additional settings available on the front-matter
# Site logo in the index.html (as in demo.ghost.io)
# Author's page cover in _layouts/author.html
# The same for page.html and tag.html layouts
# Post's page cover as a per-post basis _posts/...
# Disqus comments as a per-post basis
# ...

exclude:
  - README.md
  - Rakefile
  - Gemfile
  - Gemfile.lock
  - changelog.md
  - "*.Rmd"
  - vendor
  - node_modules
  - .git
  - .idea
  - .vscode
  - .github
  - .jekyll-cache