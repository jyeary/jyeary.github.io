version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Jekyll and its plugins tend to need to move together.
      jekyll:
        patterns:
          - "jekyll"
          - "jekyll-*"
          - "kramdown*"
          - "rouge"
          - "liquid"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
